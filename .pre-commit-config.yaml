# Requires a reviewed, locally installed Gitleaks v8.30.1 and pre-commit.
# No APIs, no secrets and no external network calls during the scan.
repos:
  - repo: local
    hooks:
      - id: gitleaks-local
        name: Detect secrets in staged changes
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]
